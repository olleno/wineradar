<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>QR sign · Wine Radar</title>
<!-- Wine Radar: utskrivbar QR-skylt för provningsdisken. ?w=<region>/<vingård>. QR-koden öppnar vingårdens sida med ?in=1 (checkar in direkt). -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600&family=Hanken+Grotesk:wght@400;600;800&display=swap">
<script src="qr.js"></script>
<style>
:root{--wine:#6b1631;--ink:#171314;--muted:#6c6461;--bg:#fcfbf9}
*{box-sizing:border-box}body{margin:0;background:#e9e4df;font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink)}
.bar{max-width:148mm;margin:16px auto;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bar button{font:600 15px 'Hanken Grotesk',sans-serif;background:var(--wine);color:#fff;border:0;padding:10px 18px;cursor:pointer}
.sign{width:148mm;min-height:210mm;margin:0 auto 24px;background:var(--bg);padding:14mm 12mm;display:flex;flex-direction:column;align-items:center;text-align:center;border-top:6mm solid var(--wine)}
.brand{display:flex;align-items:center;gap:10px;color:var(--wine);letter-spacing:.18em;font:600 15pt 'Bodoni Moda',serif}
.brand svg{width:34px;height:32px}
h1{font:800 30pt/1.05 'Hanken Grotesk',sans-serif;margin:11mm 0 3mm}
.en{font-size:13pt;color:var(--muted);margin:0 0 7mm}
#qr{padding:5mm;background:#fff;border:1px solid #ddd}
#qr svg{display:block;width:70mm;height:70mm}
.name{font:600 19pt 'Bodoni Moda',serif;margin:8mm 0 1mm}
.town{color:var(--muted);font-size:12pt;margin:0}
.how{margin-top:auto;font-size:11pt;color:var(--muted);line-height:1.45}
.how b{color:var(--ink)}
.err{max-width:148mm;margin:40px auto;font-size:16px;text-align:center}
@media print{body{background:#fff}.bar{display:none}.sign{margin:0;border-top-width:6mm}@page{size:A5;margin:0}}
</style></head>
<body>
<div class="bar"><button onclick="print()">Print / Drucken / Skriv ut</button></div>
<div id="out"></div>
<script>
(function(){
  var L={
    de:{h:'Hier einchecken',how:'<b>Kamera auf den Code richten</b> – ohne App. Ihr Besuch landet in Ihrer Weinreise, mit Abzeichen und Instagram-Bild.'},
    fr:{h:'Enregistrez votre visite ici',how:'<b>Visez le code avec l’appareil photo</b> – sans application. Votre visite rejoint votre voyage du vin, avec badges et image pour Instagram.'},
    it:{h:'Registra qui la tua visita',how:'<b>Inquadra il codice con la fotocamera</b> – senza app. La visita entra nel tuo viaggio del vino, con badge e immagine per Instagram.'},
    es:{h:'Registra aquí tu visita',how:'<b>Apunta la cámara al código</b>, sin app. Tu visita se guarda en tu viaje del vino, con insignias e imagen para Instagram.'},
    en:{h:'Check in here',how:'<b>Point your phone camera at the code</b> – no app needed. Your visit goes into your wine trip, with badges and a picture for Instagram.'}
  };
  var C={austria:'de',germany:'de',france:'fr',italy:'it',spain:'es',argentina:'es'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var w=(new URLSearchParams(location.search).get('w')||'').trim(),out=document.getElementById('out');
  fetch('/assets/wineries-all.json').then(function(r){return r.json();}).then(function(W){
    var x=W[w];if(!x){out.innerHTML='<p class="err">Winery not found.</p>';return;}
    var lang=C[(x[6].split('/')[1]||'')]||'en',t=L[lang],url='https://wineradar.net'+x[6]+'?in=1';
    document.title='QR · '+x[3]+' · Wine Radar';document.documentElement.lang=lang;
    out.innerHTML='<div class="sign"><div class="brand"><svg viewBox="0 0 130 120" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="6"><path d="M70 40 a26 26 0 0 1 26 26"/><path d="M70 24 a42 42 0 0 1 42 42" opacity=".7"/><path d="M70 8 a58 58 0 0 1 58 58" opacity=".4"/></g><path d="M44 18h12v22c0 4 10 10 10 22v46a4 4 0 0 1-4 4H38a4 4 0 0 1-4-4V62c0-12 10-18 10-22z" fill="currentColor"/><rect x="42" y="12" width="16" height="8" rx="2" fill="currentColor"/></svg>WINE RADAR</div>'+
      '<h1>'+esc(t.h)+'</h1>'+(lang!=='en'?'<p class="en">'+esc(L.en.h)+'</p>':'<p class="en">&nbsp;</p>')+
      '<div id="qr"></div><p class="name">'+esc(x[3])+'</p><p class="town">'+esc(x[4])+' · '+esc(x[5])+'</p>'+
      '<p class="how">'+t.how+(lang!=='en'?'<br><br>'+L.en.how:'')+'<br><br>wineradar.net</p></div>';
    var qr=qrcode(0,'M');qr.addData(url);qr.make();document.getElementById('qr').innerHTML=qr.createSvgTag({cellSize:8,margin:0,scalable:true});
  }).catch(function(){out.innerHTML='<p class="err">Could not load the winery list.</p>';});
})();
</script>
</body></html>
